{% extends "base.html" %}
{% block title %}Login — FaceAttend{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="login-card">
    <div class="logo-row">
      <div class="brand-icon" style="width:56px;height:56px;font-size:26px;">🎯</div>
    </div>
    <h2 style="text-align:center;margin:0 0 6px;">Admin / Teacher Login</h2>
    <p style="text-align:center;color:var(--text-2);font-size:13.5px;margin-bottom:26px;">Sign in to access the attendance dashboard</p>

    <form method="POST">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" required autofocus>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Login →</button>
    </form>

    <div class="hint-box">
      Default demo credentials — <b>admin</b> / <b>admin123</b>. Please change this after first login.
    </div>
  </div>
</div>
{% endblock %}
